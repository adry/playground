<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Graveyard Level Editor</title>
<meta name="robots" content="noindex, nofollow" />
<!--
  THE LEVEL EDITOR. Unlisted, not private.

  Nothing links here from /, /ghostly/ or /lab/, and this page links nowhere
  either. It is a static page with no backend, so anyone who is handed the URL
  can open it: this is a door nobody is told about, not a locked one, and it is
  not the place for anything that would matter if a stranger opened it.

  It writes to three places, all of them local to this browser. Its autosave is
  localStorage under this page's own key, which only this page reads. Its output
  is a JSON file the owner downloads on purpose. And its PLAY button puts the
  document into one more key, which /lab/?game=1&level=session reads: that is
  the authoring loop, it is the only way anything here reaches a page that
  ships, and it happens only when somebody presses the button. Nothing links to
  that URL and a stranger opening /lab/?game=1 gets the level the site ships.
-->
<style>
  /* ==========================================================================
     THE TOOL'S OWN LOOK, AND WHY IT IS THIS ONE
     ==========================================================================

     The first version of this page was made of native controls: tick boxes,
     selects, eleven pixel text at one size, labels in flat rows, prose in
     paragraphs. It worked and it read as a settings dialog that happened to
     have a graveyard in it. The graveyard is the best looking thing in the
     project and the tool around it looked like nothing.

     Four decisions, and everything below follows from them.

     THE SCENE IS THE BRIGHTEST THING ON SCREEN. The canvas clears to #b9bec7
     and the props are bone white, so the chrome goes dark and quiet and the
     level is the only lit thing in the window. The old layout put a light grey
     slab either side of a black void with the level in the middle, and every
     part of the window was the same value.

     THE ACCENT COMES FROM THE GAME. #f0902a is the candle in the pumpkins and
     the flame in the lanterns, and it is spent on exactly one thing: what is
     active right now. A generic blue would have been a decision about nothing.

     THREE TYPE SIZES AND ONE SPACING UNIT. 10px tracked capitals for a section,
     11px for a label, 12px for anything to read. Space is 4px or a multiple,
     never between. That is most of the difference between dense and designed.

     NOTHING NATIVE THAT CAN BE SEEN. A tick box, a select and a radio are three
     different shapes for the same act of choosing, and the browser draws all
     three in its own house style rather than this one. A short closed set is a
     segmented control or a row of swatches; a select survives only where the
     list is long enough that a row of buttons would wrap four times.

     What is deliberately NOT here: any framework, any component library, any
     web font. Hand written, in the page, like everything else in this project.
     And no animation longer than 120ms anywhere, because this is a tool
     somebody works in for hours and a tool that keeps moving is exhausting.
     ========================================================================== */

  :root {
    /* the scene, and the two panels either side of it */
    --ground: #b9bec7;
    --panel: #191c22;
    --card: #21252d;
    --card-hi: #272c36;
    --line: #313742;
    --line-soft: #262b34;

    /* bone, from the props */
    --ink: #ecead4;
    --dim: #a2a8b4;
    --faint: #6f7784;

    /* the candle */
    --accent: #f0902a;
    --accent-dim: #a8641d;
    --on-accent: #1a1d23;

    --bad: #e5615a;
    --warn: #d8a33a;
    --ok: #5fb277;

    --r: 7px;
    --r-sm: 5px;

    --t-head: 10px;
    --t-label: 11px;
    --t-body: 12px;

    --sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--panel);
    font: 400 var(--t-body)/1.5 var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  #app {
    display: grid;
    grid-template-columns: 252px 1fr 292px;
    height: 100%;
  }

  /* --- the stage ---------------------------------------------------------- */

  .stage { position: relative; overflow: hidden; background: #0f1116; }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
  }
  .stage[data-tool="select"] #view { cursor: default; }
  .stage[data-pan="1"] #view { cursor: grabbing; }

  /* --- the panels --------------------------------------------------------- */

  .panel {
    background: var(--panel);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 12px 12px 48px;
  }
  .panel.left { border-right: 1px solid var(--line-soft); }
  .panel.right { border-left: 1px solid var(--line-soft); }
  .panel::-webkit-scrollbar { width: 10px; }
  .panel::-webkit-scrollbar-thumb {
    background: var(--line);
    border: 3px solid var(--panel);
    border-radius: 5px;
  }
  .panel::-webkit-scrollbar-track { background: transparent; }

  /* A CARD PER THING. LEVEL, WALL, VIEW, SPAWNS, SELECTION, AUDIT and FAIRNESS
     are separate subjects, and a stream of capitalised labels down one column
     does not say so. Air between them does. */
  .card {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r);
    padding: 8px 8px 10px;
    margin: 0 0 8px;
  }
  .card > h2 {
    margin: 0 0 8px;
    font: 700 var(--t-head)/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card > h2 .count {
    margin-left: auto;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--dim);
  }
  .card > h2 .count[data-bad="1"] { color: var(--bad); }

  .row { display: flex; gap: 6px; align-items: center; margin: 0 0 6px; }
  .row:last-child { margin-bottom: 0; }
  .row > label { flex: 0 0 54px; color: var(--dim); font-size: var(--t-label); }
  .row > label.grow, .grow { flex: 1 1 auto; min-width: 0; }
  .row .value { color: var(--ink); font-size: var(--t-label); }

  /* --- controls ------------------------------------------------------------
     One button, one input, one select, and no browser defaults left showing. */

  button, select, input {
    font: 400 var(--t-label)/1.4 var(--sans);
    color: var(--ink);
    background: var(--card-hi);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 5px 8px;
    transition: background 90ms linear, border-color 90ms linear, color 90ms linear;
  }
  button { cursor: pointer; }
  button:hover, select:hover { background: #2e3440; border-color: #3c434e; }
  button:active { transform: translateY(0.5px); }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button[disabled] {
    opacity: 0.38;
    cursor: not-allowed;
    background: var(--card);
  }
  button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }
  button[aria-pressed="true"]:hover { background: #ffa03a; border-color: #ffa03a; }
  button.danger { color: var(--bad); }
  button.danger:hover { background: #33232a; border-color: #4a2f34; }

  input[type="text"], input[type="number"] {
    background: #15181d;
    border-color: var(--line);
    font-variant-numeric: tabular-nums;
  }
  input[type="text"]:focus, input[type="number"]:focus {
    border-color: var(--accent-dim);
    background: #13161b;
  }
  select {
    appearance: none;
    padding-right: 20px;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                      linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 11px) 50%, calc(100% - 7px) 50%;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  select option { background: var(--card); color: var(--ink); }

  /* A SEGMENTED CONTROL, for a closed set of three or four. One track, the
     active cell filled with the candle. It replaces a native select wherever
     the whole set fits on a line, because the set IS the information. */
  .seg {
    display: flex;
    background: #15181d;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 2px;
    gap: 2px;
    flex: 1 1 auto;
    min-width: 0;
  }
  .seg button {
    flex: 1 1 0;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: 4px 2px;
    border-radius: 3px;
    font-size: var(--t-label);
    color: var(--dim);
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seg button:hover { background: #262b34; color: var(--ink); }
  .seg button[aria-pressed="true"] {
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
  }

  /* A SWATCH ROW for the ground materials: the colour IS the label, so the
     name goes underneath at label size and the sample does the work. */
  .swatchrow { display: flex; gap: 4px; }
  .swatchrow button {
    flex: 1 1 0;
    min-width: 0;
    padding: 4px;
    display: grid;
    gap: 3px;
    justify-items: center;
    background: var(--card-hi);
  }
  .swatchrow .chip {
    width: 100%;
    height: 16px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.35);
  }
  .swatchrow .name { font-size: 10px; color: var(--dim); }
  .swatchrow button[aria-pressed="true"] .name { color: var(--on-accent); }

  /* --- the palette ---------------------------------------------------------
     A PICTURE OF THE THING. Twenty-nine headstones named "draped", "stele" and
     "celtic" is a glossary, not a palette: the owner drew every one of them by
     eye and could not see any of them in the tool that places them. Each tile
     is a render of the actual prop at the game's own camera angle, so what you
     pick is what you will get. See src/editor/thumbs.js. */
  .tiles {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .tiles.wide { grid-template-columns: repeat(2, 1fr); }
  .tiles button {
    padding: 3px 3px 4px;
    display: grid;
    gap: 2px;
    justify-items: center;
    background: var(--card-hi);
    position: relative;
  }
  .tiles .shot {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 3px;
    background: #2b313b radial-gradient(ellipse at 50% 78%, rgba(0,0,0,0.35), transparent 62%);
    display: block;
    object-fit: contain;
  }
  /* Until its render arrives. Not a spinner: a spinner in a grid of fifty is a
     disco, and these fill in within a second or two of the group opening. */
  .tiles .shot:not([src]) { opacity: 0.5; }
  .tiles .name {
    font-size: 10px;
    line-height: 1.25;
    color: var(--dim);
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .tiles button[aria-pressed="true"] .name { color: var(--on-accent); }
  .tiles kbd {
    position: absolute;
    top: 3px;
    right: 4px;
    font: 400 9px/1 var(--mono);
    color: var(--faint);
  }
  .tiles button[aria-pressed="true"] kbd { color: var(--on-accent); opacity: 0.7; }

  /* The groups. A summary is a row you press, so it looks like one. */
  details.group {
    background: var(--card);
    border: 1px solid var(--line-soft);
    border-radius: var(--r);
    margin: 0 0 6px;
    overflow: hidden;
  }
  details.group > summary {
    cursor: pointer;
    list-style: none;
    padding: 7px 9px;
    font: 600 var(--t-label)/1.2 var(--sans);
    color: var(--dim);
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary:hover { background: var(--card-hi); color: var(--ink); }
  details.group > summary::before {
    content: '';
    width: 0; height: 0;
    border: 4px solid transparent;
    border-left-color: var(--faint);
    margin-right: 1px;
    transition: transform 110ms ease;
  }
  details.group[open] > summary::before { transform: rotate(90deg) translateX(-1px); }
  details.group[open] > summary { color: var(--ink); border-bottom: 1px solid var(--line-soft); }
  details.group > summary .n { margin-left: auto; color: var(--faint); font-weight: 400; }
  details.group .body { padding: 7px; display: grid; gap: 6px; }

  /* --- lists ---------------------------------------------------------------- */

  .issues { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  .issues li {
    padding: 5px 7px;
    border-radius: var(--r-sm);
    border-left: 2px solid var(--warn);
    background: #1b1f26;
    cursor: pointer;
    font-size: var(--t-label);
    line-height: 1.4;
    color: var(--dim);
  }
  .issues li[data-severity="error"] { border-left-color: var(--bad); color: #f0b6b1; }
  .issues li:hover { background: var(--card-hi); color: var(--ink); }
  .issues .none {
    border-left-color: var(--ok);
    color: var(--faint);
    cursor: default;
    background: transparent;
  }
  .issues .none:hover { background: transparent; color: var(--faint); }

  .spawns { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
  .spawns li {
    display: flex;
    gap: 4px;
    align-items: center;
    background: #1b1f26;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-sm);
    padding: 4px;
  }
  .spawns .n {
    flex: 0 0 20px;
    text-align: center;
    font: 700 var(--t-label)/1.7 var(--mono);
    color: var(--on-accent);
    background: var(--accent);
    border-radius: 4px;
  }
  .spawns select { flex: 1 1 auto; min-width: 0; padding: 3px 18px 3px 6px; }
  .spawns button { padding: 3px 6px; color: var(--dim); }

  /* One change of stone: where and to what on the first line, how the two
     builds meet on the second. */
  .style {
    background: #1b1f26;
    border: 1px solid var(--line-soft);
    border-radius: var(--r-sm);
    padding: 5px;
    margin: 0 0 5px;
  }

  /* --- the badges over the scene -------------------------------------------- */

  .badges { position: absolute; inset: 0; pointer-events: none; }
  .badge {
    position: absolute;
    left: 0; top: 0;
    margin: -34px 0 0 0;
    transform-origin: 0 0;
    translate: -50% 0;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(25, 28, 34, 0.92);
    border: 1px solid var(--accent-dim);
    color: var(--ink);
    font: 600 10px/1.6 var(--mono);
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  /* --- the two overlays on the scene ---------------------------------------- */

  .status {
    position: absolute;
    right: 12px;
    top: 12px;
    padding: 7px 10px;
    border-radius: var(--r);
    background: rgba(25, 28, 34, 0.86);
    border: 1px solid rgba(255,255,255,0.06);
    font: 400 var(--t-label)/1.7 var(--mono);
    color: var(--dim);
    pointer-events: none;
    text-align: right;
    max-width: 420px;
  }
  .status b { color: var(--ink); font-weight: 600; }
  .status .bad { color: var(--bad); font-weight: 600; }
  .status .ok { color: var(--ok); }
  .status .say { color: var(--accent); }

  /* THE KEYS, BEHIND A BUTTON. Four lines of shortcuts are read once and then
     take up the bottom of the window for ever. The handles on a selected prop
     are what made this affordable: the two things a person could only learn
     from this text are now visible on the floor. */
  .keys {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: grid;
    gap: 6px;
    justify-items: start;
  }
  .keys .sheet {
    margin: 0;
    padding: 8px 11px;
    border-radius: var(--r);
    background: rgba(25, 28, 34, 0.9);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--dim);
    font: 400 var(--t-label)/1.8 var(--mono);
    white-space: pre-line;
  }
  .keys .sheet b { color: var(--ink); font-weight: 600; }
  .keys[data-open="0"] .sheet { display: none; }
  .keys .toggle {
    background: rgba(25, 28, 34, 0.86);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--dim);
    font: 600 10px/1 var(--mono);
    letter-spacing: 0.1em;
    padding: 6px 9px;
    border-radius: 999px;
  }
  .keys .toggle:hover { color: var(--ink); background: rgba(35, 40, 48, 0.95); }

  /* The one mode, above the list of things. */
  .card.mode { padding: 6px; }
  .card.mode button { display: flex; align-items: center; width: 100%; }
  .card.mode kbd {
    margin-left: auto;
    font: 400 10px/1 var(--mono);
    opacity: 0.6;
  }

  /* PLAY. The one button in the tool that is a verb rather than a setting, and
     the whole of the authoring loop: it hands the document to the game in a tab
     of its own with no file in between. It gets the candle, because it is the
     only thing here that is not editing. */
  button.play {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 7px 8px;
  }
  button.play:hover { background: #ffa03a; border-color: #ffa03a; }

  .stack { display: grid; gap: 6px; }

  /* The one native control kept, because a yaw is genuinely continuous and a
     row of buttons cannot say 37 degrees. Dressed to match everything else. */
  input[type="range"].dial {
    appearance: none;
    background: transparent;
    padding: 0;
    border: 0;
    height: 18px;
  }
  input[type="range"].dial::-webkit-slider-runnable-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  input[type="range"].dial::-webkit-slider-thumb {
    appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -4.5px;
    border-radius: 50%;
    background: var(--accent);
    border: 0;
  }
  input[type="range"].dial::-moz-range-track {
    height: 3px;
    border-radius: 2px;
    background: var(--line);
  }
  input[type="range"].dial::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
  }

  /* A note is a sentence, not a paragraph of prose. The long explanations live
     behind the card's own info button. */
  .note {
    color: var(--faint);
    font-size: var(--t-label);
    line-height: 1.45;
    margin: 0;
  }
  .info {
    padding: 0 5px;
    border-radius: 999px;
    color: var(--faint);
    font: 700 10px/1.4 var(--mono);
    background: transparent;
    border: 1px solid var(--line);
  }
  .info:hover { color: var(--accent); border-color: var(--accent-dim); background: transparent; }
  .info[aria-pressed="true"] {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  .drop {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(240, 144, 42, 0.1);
    border: 3px dashed var(--accent);
    font: 600 14px/1 var(--sans);
    color: var(--accent);
  }
  .stage[data-drop="1"] .drop { display: grid; }
</style>
</head>
<body>
  <div id="app">
    <div class="panel left" id="left"></div>
    <div class="stage" id="stage" data-tool="select">
      <canvas id="view" tabindex="0" aria-label="The level being edited."></canvas>
      <div class="drop">drop a level json here</div>
      <div class="status" id="status"></div>
      <div class="keys" id="keys" data-open="0">
        <p class="sheet" id="hint"></p>
        <button class="toggle" id="keys-toggle" type="button" aria-pressed="false">KEYS</button>
      </div>
    </div>
    <div class="panel right" id="right"></div>
  </div>
  <script type="module" src="/src/editor/main.js"></script>
</body>
</html>
