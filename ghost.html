<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloth Ghost</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #b9bec7; }
  body {
    font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #2b2f3a;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.42);
    backdrop-filter: blur(14px) saturate(1.2);
    white-space: nowrap;
    transition: opacity 0.6s ease;
  }
  .hint.faded { opacity: 0; }
  kbd {
    display: inline-block;
    min-width: 20px;
    padding: 2px 6px;
    border-radius: 5px;
    border: 1px solid rgba(0, 0, 0, 0.14);
    border-bottom-width: 2px;
    background: rgba(255, 255, 255, 0.8);
    font: inherit;
    font-size: 11px;
    text-align: center;
  }
  .sep { width: 1px; height: 15px; background: rgba(0, 0, 0, 0.13); }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div class="hint" id="hint">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
    <span class="sep"></span>
    <span><kbd>space</kbd> hop</span>
    <span class="sep"></span>
    <span>or drag to lead it around</span>
  </div>
  <script type="module" src="/src/ghost/main.js"></script>
  <script>
    // Fade the hint once the player has actually moved.
    const hint = document.getElementById('hint');
    const hide = () => { hint.classList.add('faded'); cleanup(); };
    const onKey = (e) => { if (['KeyW','KeyA','KeyS','KeyD','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) hide(); };
    function cleanup() {
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('pointerdown', hide);
    }
    window.addEventListener('keydown', onKey);
    window.addEventListener('pointerdown', hide);
  </script>
</body>
</html>
