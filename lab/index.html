<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ghostly Lab</title>
<meta name="description" content="Work in progress. Everything currently being built for the ghost scene, in one place." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%91%BB%3C/text%3E%3C/svg%3E" />

<!-- THE LINK CARD, and what it can and cannot do.
     ==========================================================================
     An x.com/intent/tweet URL has no parameter for an image, so a shared score
     gets a picture one of two ways: the post carries an ATTACHED file, which is
     src/game/share.js and works today wherever navigator.canShare({files}) does,
     or X FETCHES THIS PAGE and reads the tags below.

     The tags are the second way and they are worth nothing yet. X's crawler has
     to be able to reach the URL, and this project has no deploy target: no host,
     no domain, no hosting config anywhere in the repository. Until that changes
     these lines are inert, and there is no way to test them. They are here
     because they cost nothing and start working on the day there is a host.

     TWO THINGS TO FIX ON THAT DAY:
       1. twitter:image and og:image MUST become absolute URLs. The relative one
          below is resolved by most crawlers and guaranteed by none.
       2. The picture is THE SAME FOR EVERY PLAYER. A per-run card needs a URL
          that a server renders per run, which is a backend, not a meta tag.
          The attached-file path above is what makes a share personal today. -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Graveyard" />
<meta name="twitter:description" content="A Pac-Man in a cemetery. Sweep the fireflies, jump the fences, and do not let the dead corner you." />
<meta name="twitter:image" content="/share-card.png" />
<meta name="twitter:image:alt" content="A cloth ghost fleeing a walking skeleton between headstones." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Graveyard" />
<meta property="og:description" content="A Pac-Man in a cemetery. Sweep the fireflies, jump the fences, and do not let the dead corner you." />
<meta property="og:image" content="/share-card.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="628" />

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SS5R0SLVFV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SS5R0SLVFV');
</script>
<style>
  /* One committed visual world: a lit studio floor. The scene's clear colour is
     a fixed light grey, so a dark variant would put the page and the canvas in
     two different rooms. The ground is painted explicitly so the page holds on
     either host background. */
  :root { --ground: #b9bec7; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ground);
  }

  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #view:active { cursor: grabbing; }
  #view:focus-visible { outline: 2px solid #5566b8; outline-offset: -4px; }

  .hint {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    margin: 0;
    font: 400 12px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #565c66;
    pointer-events: none;
    user-select: none;
  }
  .hint a { color: inherit; pointer-events: auto; }

  /* The game's score line. Tabular figures so the score does not jiggle the
     lives along beside it every time it ticks over. */
  .hud {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    color: #3c4250;
    pointer-events: none;
    user-select: none;
    white-space: pre;
  }

  /* The end card. Deliberately not a modal: it does not trap focus, it does not
     dim the scene, and the maze stays visible behind it, because the last thing
     that happened is the thing worth looking at. */
  .card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 280px;
    max-width: min(92vw, 380px);
    padding: 22px 24px 18px;
    border-radius: 14px;
    background: rgba(249, 250, 252, 0.94);
    box-shadow: 0 18px 50px rgba(30, 35, 48, 0.28);
    font: 400 14px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #2f3542;
    text-align: center;
  }
  .card h1 {
    margin: 0 0 10px;
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.22em;
    color: #7b8494;
  }
  .card .story { margin: 0 0 14px; white-space: pre-line; }
  .card .board {
    margin: 0 0 16px;
    padding: 0;
    list-style: none;
    font: 400 12.5px/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: #6b7383;
    max-height: 148px;
    overflow-y: auto;
  }
  .card .board .mine { color: #2f3542; font-weight: 600; }
  .card .share, .card .again {
    display: inline-block;
    margin: 0 4px;
    padding: 9px 16px;
    border: 0;
    border-radius: 999px;
    font: 600 13px/1 inherit;
    cursor: pointer;
    text-decoration: none;
  }
  .card .share { background: #16181c; color: #fff; }
  .card .again { background: #e5e8ee; color: #2f3542; }
</style>
</head>
<body data-scene="full">
  <canvas id="view" tabindex="0" aria-label="Every asset in the project, laid out on a floor and turning so each can be seen from all sides. Drag to pan, scroll to zoom."></canvas>
  <p class="hint">drag to pan &middot; scroll to zoom &middot; space to stop the turn &middot; r to reset &middot; <a href="?world=1">walk the level</a></p>
  <script type="module" src="/src/lab/main.js"></script>
</body>
</html>
