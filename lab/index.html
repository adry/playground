<style>
  /* One committed visual world: a lit studio floor. The scene's clear colour is
     a fixed light grey, so a dark variant would put the page and the canvas in
     two different rooms. The ground is painted explicitly so the page holds on
     either host background. */
  :root { --ground: #b9bec7; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ground);
  }

  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #view:active { cursor: grabbing; }
  #view:focus-visible { outline: 2px solid #5566b8; outline-offset: -4px; }

  .hint {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    margin: 0;
    font: 400 12px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #565c66;
    pointer-events: none;
    user-select: none;
  }
  .hint a { color: inherit; pointer-events: auto; }

  /* The game's score line. Tabular figures so the score does not jiggle the
     lives along beside it every time it ticks over. */
  .hud {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    color: #3c4250;
    pointer-events: none;
    user-select: none;
    white-space: pre;
  }
</style>
</head>
<body data-scene="full">
  <canvas id="view" tabindex="0" aria-label="Every asset in the project, laid out on a floor and turning so each can be seen from all sides. Drag to pan, scroll to zoom."></canvas>
  <p class="hint">drag to pan &middot; scroll to zoom &middot; space to stop the turn &middot; r to reset &middot; <a href="?play=1">play the scene</a> &middot; <a href="?game=1">play the game</a></p>
  <script type="module" src="/src/lab/main.js"></script>
</body>
</html>
