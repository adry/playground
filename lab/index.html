<style>
  /* One committed visual world: a lit studio floor. The scene's clear colour is
     a fixed light grey, so a dark variant would put the page and the canvas in
     two different rooms. The ground is painted explicitly so the page holds on
     either host background. */
  :root { --ground: #b9bec7; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ground);
  }

  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #view:active { cursor: grabbing; }
  #view:focus-visible { outline: 2px solid #5566b8; outline-offset: -4px; }

  .hint {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    margin: 0;
    font: 400 12px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #565c66;
    pointer-events: none;
    user-select: none;
  }
  .hint a { color: inherit; pointer-events: auto; }

  /* The game's score line. Tabular figures so the score does not jiggle the
     lives along beside it every time it ticks over. */
  .hud {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font: 600 15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    color: #3c4250;
    pointer-events: none;
    user-select: none;
    white-space: pre;
  }

  /* The end card. Deliberately not a modal: it does not trap focus, it does not
     dim the scene, and the maze stays visible behind it, because the last thing
     that happened is the thing worth looking at. */
  .card {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    min-width: 280px;
    max-width: min(92vw, 380px);
    padding: 22px 24px 18px;
    border-radius: 14px;
    background: rgba(249, 250, 252, 0.94);
    box-shadow: 0 18px 50px rgba(30, 35, 48, 0.28);
    font: 400 14px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: #2f3542;
    text-align: center;
  }
  .card h1 {
    margin: 0 0 10px;
    font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.22em;
    color: #7b8494;
  }
  .card .story { margin: 0 0 14px; white-space: pre-line; }
  .card .board {
    margin: 0 0 16px;
    padding: 0;
    list-style: none;
    font: 400 12.5px/1.9 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: #6b7383;
    max-height: 148px;
    overflow-y: auto;
  }
  .card .board .mine { color: #2f3542; font-weight: 600; }
  .card .share, .card .again {
    display: inline-block;
    margin: 0 4px;
    padding: 9px 16px;
    border: 0;
    border-radius: 999px;
    font: 600 13px/1 inherit;
    cursor: pointer;
    text-decoration: none;
  }
  .card .share { background: #16181c; color: #fff; }
  .card .again { background: #e5e8ee; color: #2f3542; }
</style>
</head>
<body data-scene="full">
