<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebGL Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%236fd3ff'/%3E%3C/svg%3E" />
<style>
  :root {
    --ink: #eef1f8;
    --dim: #7d879e;
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05060b; color: var(--ink); overflow: hidden; }
  body {
    font: 13px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .panel {
    position: fixed;
    left: 20px;
    top: 20px;
    width: 268px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(8, 10, 18, 0.62);
    backdrop-filter: blur(18px) saturate(1.3);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }

  .item {
    display: flex;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    margin-bottom: 4px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .item:hover { background: rgba(255, 255, 255, 0.05); }
  .item.active { background: rgba(120, 170, 255, 0.11); border-color: rgba(120, 170, 255, 0.28); }
  .idx { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 1px; }
  .body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .name { font-weight: 550; }
  .note { color: var(--dim); font-size: 11.5px; }

  .footer { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  kbd {
    display: inline-block; padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.05); font: inherit; font-size: 10.5px;
  }

  .status {
    position: fixed; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 12px;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(8, 10, 18, 0.62); backdrop-filter: blur(18px);
    color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11.5px;
    transition: opacity 0.35s ease;
  }
  .track { width: 120px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
  #bar { height: 100%; background: linear-gradient(90deg, #6fd3ff, #b58cff); transform-origin: left; transform: scaleX(0); }

  body.clean .panel, body.clean .status { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="view"></canvas>

  <aside class="panel">
    <div class="title">WebGL Lab</div>
    <div id="menu"></div>
    <div class="footer">
      <kbd>1-9</kbd> switch · <kbd>space</kbd> pause · <kbd>r</kbd> restart<br />
      <kbd>q</kbd> quality · <kbd>h</kbd> hide UI<br />
      <a href="/ghost.html" style="color:#8fb8ff">cloth ghost →</a>
    </div>
  </aside>

  <div class="status">
    <span id="hud">booting</span>
    <span class="track"><span id="bar"></span></span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
